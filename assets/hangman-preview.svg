<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#0B1120"/>
  <rect x="34" y="34" width="1132" height="607" rx="20" fill="url(#bg)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="70" cy="70" r="8" fill="#FB7185"/>
  <circle cx="96" cy="70" r="8" fill="#FBBF24"/>
  <circle cx="122" cy="70" r="8" fill="#34D399"/>
  <text x="600" y="76" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">hangman.exe</text>

  <text x="82" y="138" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700">The Hangman Game</text>
  <text x="82" y="179" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Welcome to Hangman! Guess the secret word letter by letter.</text>
  <text x="82" y="203" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Solve it before you run out of lives.</text>

  <text x="82" y="258" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">A B C D E F G H I J K L M</text>
  <text x="82" y="286" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">N O P Q R S T U V W X Y Z</text>

  <text x="82" y="347" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Secret Word:</text>
  <text x="82" y="385" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="9">_ O _ _ _ _ _</text>
  <text x="82" y="415" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">(8 letters)</text>
  <text x="82" y="465" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Incorrect Guesses: <tspan fill="#F87171">A E T</tspan></text>
  <text x="82" y="500" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Lives Left: <tspan fill="#FBBF24">4</tspan></text>
  <text x="82" y="565" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Next guess please? <tspan fill="#F8FAFC">O</tspan></text>

  <g transform="translate(890 235)" stroke="#E2E8F0" stroke-width="7" stroke-linecap="square">
    <path d="M0 245H220"/>
    <path d="M35 245V20H155"/>
    <path d="M155 20V60"/>
    <circle cx="155" cy="91" r="30"/>
    <path d="M155 121V185M155 140L124 170M155 140L186 170M155 185L126 225M155 185L184 225"/>
  </g>
  <text x="1100" y="575" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">7-stage ASCII progress</text>
</svg>
